# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 Database Configuration (for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=Vx9uN!6t^QmZx@5Kj#WmRgUvTxZzQmBnKyXyZtUwGhXyKuTrMzBxZqLpAvGtRwTn
jwt.expiration=86400

# Logging Configuration
logging.level.com.insp17.ytms=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Application Configuration
app.name=YouTube Video Management System
app.version=1.0.0

# Disable services that require external dependencies for testing
# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=testpass

# File Storage (simplified for testing)
deployed.at=LOCAL
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Disable Redis for testing
spring.cache.type=simple